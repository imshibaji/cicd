services:
  n8n:
    image: n8nio/n8n:latest
    ports:
      - 5678:5678
    environment:
      NODE_ENV: production
      GENERIC_TIMEZONE: "Asia/Kolkata"
      TZ: "Asia/Kolkata"
      N8N_RESTRICT_FILE_ACCESS_TO: /home/files
    volumes:
      - n8n_data:/home/node/.n8n
      - ./files:/home/files:rw

volumes:
  n8n_data:
    name: n8n_data